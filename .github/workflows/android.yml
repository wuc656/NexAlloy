name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write key
      run: |
        echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
        echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
        echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
        echo KEYSTORE_FILE=../key.jks >> signing.properties
        echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks

    - name: Build Debug
      run: ./gradlew assembleDebug

    - name: Build Release
      run: ./gradlew assembleRelease

    - name: Upload a Debug Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-ci-debug-apk
        path: app/build/outputs/apk/debug

    - name: Upload a Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nexalloy-ci-release-apk
        path: |
          app/build/outputs/apk/release
          app/build/outputs/mapping/release/mapping.txt

    - name: Update AutoBuild Release
      run: |
        LATEST_REL=$(gh release view --json tagName -q .tagName)
        GIT_DESCRIBE=$(git rev-parse --short HEAD)
        APK_NAME="NexAlloy-${GIT_DESCRIBE}.apk"
        PREVIOUS_ASSETS=$(gh release view autobuild --json assets --jq '.assets[].name')
        cd app/build/outputs/apk/release/
        mv app-release.apk "$APK_NAME"
        gh release upload autobuild "$APK_NAME" --clobber
        gh release edit autobuild \
          --title "Nightly Build" \
          --notes "Nightly build from commit ${GIT_DESCRIBE}. See changes: https://github.com/${{ github.repository }}/compare/${LATEST_REL}...main"
        while IFS= read -r asset; do
          if [[ "$asset" == NexAlloy-*.apk && "$asset" != "$APK_NAME" ]]; then
            gh release delete-asset autobuild "$asset" --yes
          fi
        done <<< "$PREVIOUS_ASSETS"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
